version: "3.8"

services:
  backend:
    image: eqi30-backend:latest
    container_name: eqi30_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    command: >
      sh -c "
        mkdir -p /app/data &&
        cp -n /app/db.sqlite3 /app/data/db.sqlite3 2>/dev/null || true &&
        ln -sf /app/data/db.sqlite3 /app/db.sqlite3 2>/dev/null || true &&
        uv run python manage.py migrate --noinput &&
        uv run python manage.py seed_eqi30 &&
        uv run gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "

volumes:
  sqlite_data:
